<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandarevAI - Чат</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/chat.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>
    <div class="container" id="appContainer">
        <!-- Компактный хедер (убрана основная шапка, но сохранена) -->
        <div class="chat-header">
            <div class="logo-container">
                <div class="logo-icon">🤖</div>
                <div>
                    <h1>LandarevAI</h1>
                    <span class="subtitle">Искусственный интеллект</span>
                </div>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
            <button class="clear-chat-btn" id="clearChatBtn" title="Очистить чат">🗑️</button>
        </div>

        <!-- Основная область (переключается режим) -->
        <div class="app" id="appArea">
            <!-- Чат-история (изначально скрыта) -->
            <div class="chat-history" id="chatWindow">
                {% if messages %}
                    {% for msg in messages %}
                        <div class="message {% if msg.username == 'LandarevAI' %}ai-message{% endif %}">
                            <div class="message-header">
                                <span class="username">{{ msg.username }}</span>
                                <span class="time">{{ msg.time }}</span>
                            </div>
                            <div class="message-text">
                                {% if msg.is_markdown %}
                                    {{ msg.text|safe }}
                                {% else %}
                                    {{ msg.text }}
                                {% endif %}
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>

            <!-- Область ввода (изначально центрирована) -->
            <div class="input-area" id="inputArea">
                <div class="welcome-content" id="welcomeContent">
                    <h2>Начните общение с LandarevAI</h2>
                </div>

                <!-- Чистая строка ввода (без лишних кнопок) -->
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Спросите LandarevAI..." maxlength="500">
                    <button id="sendButton" class="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>
</html>
